services:
  backend:
    build: ../backend
    container_name: renttoolsapp-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: https://renttoolsapp.localhost
      SESSION_SECRET: ${SESSION_SECRET}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    networks:
      - renttoolsapp-net

  frontend:
    build: ../frontend
    container_name: renttoolsapp-frontend
    restart: unless-stopped
    networks:
      - renttoolsapp-net

  proxy:
    image: nginx:1.27-alpine
    container_name: renttoolsapp-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - renttoolsapp-net

networks:
  renttoolsapp-net:
    driver: bridge